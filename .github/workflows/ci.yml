name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Playwright builds and previews the site itself, so this exercises the
      # deployed artifact rather than the dev server.
      - name: Run tests
        run: bun run test --project=chromium

# Deploy is deliberately absent. Cloudflare Workers Builds watches this repo and
# builds + deploys pushes itself; GitHub never holds a Cloudflare credential.
# The worker and v2.empyreangate.org are provisioned in github.com/cinderblock/ops.
